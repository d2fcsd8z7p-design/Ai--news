# このファイルは GitHub 上で .github/workflows/main.yml として作成してください
name: AI News to TikTok

on:
  schedule:
    - cron: "40 21 * * *"   # 日本時間 6:40 に開始 → 7時ごろ下書きが届く
    - cron: "40 8 * * *"    # 日本時間 17:40 に開始 → 18時ごろ下書きが届く
  workflow_dispatch:
    inputs:
      mode:
        description: "preview=画像だけ作る / post=TikTokに送る / setup=TikTok連携"
        type: choice
        options: [preview, post, setup]
        default: preview
      code:
        description: "setup のときだけ：連携ページに表示されたコード"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      ACCOUNT_HANDLE: ${{ vars.ACCOUNT_HANDLE }}
      POST_MODE: ${{ vars.POST_MODE }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 日本語フォントを入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: ライブラリを入れる
        run: pip install -q -r requirements.txt
      - name: git の設定
        run: |
          git config user.name "ai-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 実行
        env:
          MODE: ${{ github.event_name == 'schedule' && 'post' || inputs.mode }}
          CODE: ${{ inputs.code }}
        run: |
          case "$MODE" in
            setup)   python setup_token.py ;;
            preview) python main.py --preview ;;
            *)       python main.py ;;
          esac
      - name: TikTok のトークンを保存
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="$RUNNER_TEMP/new_refresh_token"
          if [ -s "$f" ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::GH_PAT が未設定のため、TikTok のトークンを保存できません"
              exit 1
            fi
            gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
            rm -f "$f"
            echo "TIKTOK_REFRESH_TOKEN を更新しました"
          fi
