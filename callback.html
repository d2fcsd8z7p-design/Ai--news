<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok 連携</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; background:#0b1020; color:#f3f5ff;
         max-width:560px; margin:0 auto; padding:32px 20px; line-height:1.7; }
  h1 { font-size:24px; }
  input, button, textarea { width:100%; box-sizing:border-box; font-size:17px; padding:14px;
         border-radius:12px; border:1px solid #39406a; background:#151a35; color:#fff; margin:8px 0; }
  button { background:#22d3ee; color:#0b1020; font-weight:700; border:none; }
  .box { background:#151a35; border-radius:16px; padding:20px; margin:20px 0; }
  .muted { color:#a0a8c8; font-size:14px; }
  label { display:flex; gap:8px; align-items:center; font-size:15px; }
  label input { width:auto; margin:0; }
</style>
</head>
<body>
<h1>TikTok 連携ページ</h1>
<div id="start" class="box">
  <p>① TikTok for Developers の <b>Client key</b> を入れて「TikTokと連携」を押します。</p>
  <input id="ck" placeholder="Client key" autocapitalize="off" autocomplete="off">
  <label><input type="checkbox" id="direct"> 自動公開（DIRECT_POST）も許可する<br>※TikTokの監査に通ってから</label>
  <button id="go">TikTokと連携</button>
  <p class="muted">このページ自体は何も保存・送信しません。TikTokのログイン画面に移動するだけです。</p>
</div>
<div id="done" class="box" hidden>
  <p>② 連携できました。下のコードをコピーし、GitHub の Actions で<br>
     「Run workflow」→ mode に <b>setup</b>、code に貼り付けて実行してください（数分以内に）。</p>
  <textarea id="code" rows="4" readonly></textarea>
  <button id="copy">コードをコピー</button>
</div>
<div id="err" class="box" hidden></div>
<script>
  const redirect = location.origin + location.pathname;
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  if (q.get("error")) {
    $("start").hidden = true; $("err").hidden = false;
    $("err").textContent = "エラー: " + q.get("error") + " " + (q.get("error_description") || "");
  } else if (q.get("code")) {
    let ok = true;
    try { ok = !sessionStorage.getItem("st") || sessionStorage.getItem("st") === q.get("state"); } catch (e) {}
    $("start").hidden = true;
    if (!ok) { $("err").hidden = false; $("err").textContent = "確認用の値が一致しません。最初からやり直してください。"; }
    else { $("done").hidden = false; $("code").value = q.get("code"); }
  }
  $("go").onclick = () => {
    const ck = $("ck").value.trim();
    if (!ck) return;
    const st = Math.random().toString(36).slice(2);
    try { sessionStorage.setItem("st", st); } catch (e) {}
    const scope = "user.info.basic,video.upload" + ($("direct").checked ? ",video.publish" : "");
    location.href = "https://www.tiktok.com/v2/auth/authorize/?" + new URLSearchParams({
      client_key: ck, scope, response_type: "code", redirect_uri: redirect, state: st });
  };
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("code").value); $("copy").textContent = "コピーしました"; }
    catch (e) { $("code").select(); }
  };
</script>
</body>
</html>
